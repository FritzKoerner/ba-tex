" stroke-width="1.6"/><text x="375.5" y="152" text-anchor="middle" font-size="13" fill="#3a6a3e" font-weight="600">PID-Regler</text><text x="375.5" y="165" text-anchor="middle" font-size="9.5" fill="#3a6a3e">kaskadierend</text><line x1="448" y1="155" x2="495" y2="155" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/><rect x="503" y="135" width="145" height="40" rx="5" fill="url(#gg)" stroke="#60aa64" stroke-width="1.6"/><text x="575.5" y="152" text-anchor="middle" font-size="13" fill="#3a6a3e" font-weight="600">Physiksimulator</text><text x="575.5" y="165" text-anchor="middle" font-size="9.5" fill="#3a6a3e">300 × Δt = 3,0 s</text><line x1="648" y1="155" x2="693" y2="155" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/><rect x="701" y="135" width="65" height="40" rx="5" fill="url(#gp)" stroke="#8752f6" stroke-width="1.4"/><text x="733.5" y="153" text-anchor="middle" font-size="13" fill="#4a2a8a" font-weight="600">s</text><text x="739.5" y="156" text-anchor="middle" font-size="9" fill="#4a2a8a" font-weight="600">t+1</text><text x="733.5" y="167" text-anchor="middle" font-size="9.5" fill="#888">, r</text><line x1="303" y1="125" x2="303" y2="120" stroke="#bbb" stroke-width="0.8"/><line x1="303" y1="120" x2="648" y2="120" stroke="#bbb" stroke-width="0.8"/><line x1="648" y1="120" x2="648" y2="125" stroke="#bbb" stroke-width="0.8"/><text x="475.5" y="116" text-anchor="middle" font-size="9" fill="#aaa">Entscheidungsintervall (300 Substeps)</text>
